# OpenObserve — CONFERIDO CONTRA O HOST `telemetry` em 2026-08-24 (altair, #1307).
#
# Isto é o que ESTÁ rodando (diretório do host: `/docker/openobserve-pwch/`),
# copiado como está. Não corrigi nada aqui: espelhar e melhorar são atos
# diferentes, e misturá-los é como a deriva do #1303 voltaria parecendo
# resolvida.
#
# ✅ PINADO em **v0.91.1** no host E aqui, juntos (#1480, altair 2026-08-25).
#    Pin NÃO foi upgrade: a tag `v0.91.1` e `:latest` resolviam para a MESMA
#    imagem local (`e1ff0445fab3`), então o container foi recriado byte-idêntico.
# ⚠️ `healthcheck: disable: true` FICA — por impossibilidade MEDIDA, não descuido:
#    a imagem é distroless (sem sh, curl, wget ou nc), então não existe o que rodar
#    dentro do container e `CMD`/`CMD-SHELL` não têm como funcionar. Consequência:
#    `docker ps` dizer "Up" NÃO prova que o serviço responde. A saúde deste serviço
#    só pode ser medida DE FORA.
# ⚠️ Sonda certa: `https://telemetry.thegalaxie.cloud/healthz` (host SEM path) é
#    ESTA app. `/remote/healthz` é OUTRO serviço (o signaling). Confundir os dois
#    dá 200 pelo motivo errado — foi o que aconteceu com o gate do Arquiteto.
# ⚠️ O nome do projeto (`COMPOSE_PROJECT_NAME`) entra nos nomes dos routers;
#    no host ele vem do nome da pasta: `openobserve-pwch`.
# Aqui fica o retrato fiel do host — os dois arquivos mudam juntos, sempre.
services:
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v0.91.1
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`telemetry.thegalaxie.cloud`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=letsencrypt
      - traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=5080
    environment:
      - ZO_ROOT_USER_EMAIL=${ZO_ROOT_USER_EMAIL}
      - ZO_ROOT_USER_PASSWORD=${ZO_ROOT_USER_PASSWORD}
    volumes:
      - openobserve_data:/data
    healthcheck:
      disable: true

volumes:
  openobserve_data:
