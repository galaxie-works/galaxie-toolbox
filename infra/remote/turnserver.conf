listening-port=3478
listening-ip=0.0.0.0
relay-ip=0.0.0.0
min-port=49160
max-port=49200
fingerprint
use-auth-secret
stale-nonce=600
no-multicast-peers
# ── #1184 (Altair): o relay ESTAVA ABERTO em produção ─────────────────────────
# Medido em 2026-08-18 contra `telemetry.thegalaxie.cloud:3478`: um `Register` no
# `/v1/ws` com `device_id` inventado e 32 bytes aleatórios como `public_key`
# devolve `ice_servers` com credencial válida, e o `Allocate` com ela SUCEDE
# (XOR-RELAYED-ADDRESS 145.223.94.149:49185). Quem alcança o signaling aloca.
#
# A raiz é o #1133 (credencial emitida pelo v2, atrelada ao device matriculado).
# As duas linhas abaixo são TETO, não porta — bloqueiam o pior enquanto isso.

# 1. O relay NÃO é proxy pra rede interna. Sem isto, um peer pode ser o
#    127.0.0.1 do VPS — onde moram o próprio signaling e a telemetria. Isso tem
#    forma de SSRF, com UDP arbitrário e o coturn de proxy.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
no-loopback-peers

# 2. Teto de banda (MB por sessão / MB agregados). Relay é egress: sem teto, o
#    limite é a fatura do VPS.
#    ⚠️ Números são PONTO DE PARTIDA, não medição — ninguém mediu o consumo de
#    uma sessão real ainda. Calibrar medindo uma sessão do PO sob relay (#1130).
user-quota=64
total-quota=1200

# ── #1050 (SEC10): TLS/DTLS do TURN — PENDENTE DE CERT (ação do PO/infra) ──────
# Hoje o relay roda sem TLS/DTLS (`no-tls`/`no-dtls` abaixo). Isso NÃO foi flipado
# neste PR de propósito: remover as duas linhas SEM um certificado válido faz o
# coturn FALHAR ao subir (derrubaria o relay). Pra habilitar TLS (SEC10), o PO deve:
#   1. Provisionar cert/pkey do realm (Traefik/Let's Encrypt) montados no container.
#   2. Adicionar aqui (e REMOVER `no-tls`/`no-dtls`):
#        tls-listening-port=5349
#        cert=/etc/coturn/certs/fullchain.pem
#        pkey=/etc/coturn/certs/privkey.pem
#        # (opcional) dh-file=/etc/coturn/certs/dhparam.pem
#   3. Anunciar a URL `turns:<host>:5349?transport=tcp` ao cliente (via a env
#      `GALAXIE_REMOTE_TURN_URLS` do signaling → `ice_servers`), além de stun:/turn:.
# Enquanto o cert não existir, mantém as duas linhas abaixo.
no-tls
no-dtls
pidfile=/run/coturn/turnserver.pid
log-file=stdout
simple-log
