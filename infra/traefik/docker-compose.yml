# Traefik — CONFERIDO CONTRA O HOST `telemetry` em 2026-08-24 (altair, #1307).
#
# Isto é o que ESTÁ rodando, copiado do host, não uma versão melhorada.
# Divergências conhecidas entre o que roda e o que seria bom estão anotadas
# abaixo como comentário e viram card próprio — corrigir aqui sem corrigir no
# host recriaria a deriva invisível do #1303 com aparência de resolvida.
#
# ✅ PINADO em **v3.7.10** no host E aqui, juntos (#1480, altair 2026-08-25).
#    Pin NÃO foi upgrade: `traefik:v3.7.10` e `traefik:latest` resolviam para a
#    MESMA imagem local (`9c3b91d5fb77`) no momento do pin, então o container foi
#    recriado byte-idêntico. Versão antes e depois: 3.7.10. Subir versão é outro
#    card, com a sua própria janela.
#
# ⚠️ `network_mode: host` — por isso este serviço não tem labels de roteamento;
#    ele É a borda. As rotas vêm dos labels dos OUTROS containers, via
#    `providers.docker`.
services:
  traefik:
    image: traefik:v3.7.10
    restart: unless-stopped
    network_mode: host
    command:
      - --api.dashboard=false
      - --api.insecure=false
      - --log.level=WARN
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
    volumes:
      - traefik-letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  traefik-letsencrypt:
