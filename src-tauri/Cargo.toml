[package]
name = "app"
version = "0.53.0"
description = "GALAXIE"
authors = ["Galaxie Works"]
license = ""
repository = ""
edition = "2021"
# #1076 (RB14): MSRV real do produto. `app` depende INCONDICIONALMENTE de
# `galaxie-remote-net` (edition 2024) e, com `--features remote`, também de
# remote-capture/remote-system-agent (edition 2024). Edition 2024 estabilizou no
# Rust 1.85 — então 1.77.2 era uma declaração FALSA (o crate não compila em <1.85).
# Ver a decisão registrada em AGENTS.md §8.
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[features]
# `remote` liga o backend do GALAXIE Remote (str0m/WebRTC + captura + input). OFF
# por default pra o build padrão não precisar de OpenSSL. Os comandos `remote_*`
# viram stubs (erro claro) quando OFF — o front degrada gracioso (#687-UI).
default = []
# `openssl/vendored` faz o `openssl-sys` COMPILAR o OpenSSL a partir do fonte
# (crate `openssl-src`) em vez de procurar um no sistema. Sem isso o build do
# release quebra no runner do CI, que não tem toolchain OpenSSL instalado — e era
# por isso que o instalador saía com o `remote_stub` em vez do Remote de verdade.
# O atalho local continua valendo: `OPENSSL_NO_VENDOR=1` + `OPENSSL_DIR=...`
# força o uso do OpenSSL do sistema e pula os ~10 min de compilação.
remote = [
  "dep:galaxie-remote-transport",
  "dep:galaxie-remote-capture",
  "dep:if-addrs",
  "dep:openssl",
  "openssl/vendored",
]

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# #1129 L1: custódia da chave Ed25519 do device (identidade + DPAPI-NG). Núcleo
# LEVE do remote-net (default features, SEM `client`/`authority`): só
# assinatura/serde/windows_secret — nada de tokio/openssl no build default.
galaxie-remote-net = { path = "../services/remote-net" }
zeroize = "1"
tauri = { version = "2.11.3", features = ["unstable"] }
tauri-plugin-log = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tiny_http = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
# #1044 SEC8: sanitizador de árvore HTML (html5ever) — substitui o scrub textual
# frágil do salvar_pdf por remoção real de conteúdo ativo (script/iframe/handlers).
ammonia = "4"
urlencoding = "2"
open = "5"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
argon2 = "0.5"
# #700 (App público PS7): verificação de posse de domínio por DNS TXT (resolver
# nativo, API segura; tokio já está na árvore via tauri). Lookup do TXT do domínio
# pra conferir galaxie-verify=<token>.
hickory-resolver = "0.24"
# Explorer de Arquivos (#676): erro tipado, varredura paralela e pastas do SO.
thiserror = "2"
# #1047 (SEC7): canonicalização SEM o prefixo verbatim `\\?\` (que o
# `std::fs::canonicalize` sempre adiciona no Windows) — assim a comparação
# `starts_with` de diretório sensível não quebra por prefixo divergente.
dunce = "1"
rayon = "1"
jwalk = "0.8"
dirs = "5"
# #679 (Explorer S3): manda pra Lixeira do SO em vez de apagar (delete reversível).
trash = "5"
# #680 (Explorer S4): file watcher com reconciliação de rename (debouncer-full).
notify = "7"
notify-debouncer-full = "0.4"
# #680 turbo: verificação opcional pós-cópia. xxh3 = rápido (default), blake3 =
# forte+rápido, sha256 (já temos) = compatibilidade. Opt-in — cópia normal não hasheia.
xxhash-rust = { version = "0.8", features = ["xxh3"] }
blake3 = "1"
# #736 (Explorer perf F1): gerador de thumbnail. `image` decodifica os formatos
# comuns; `fast_image_resize` faz o downscale SIMD (Lanczos3); `kamadak-exif` lê a
# thumb embutida do JPEG (fast-path, pula o decode full-res); `webp` codifica o
# resultado (leve pro DOM). Cache em disco é F2 — aqui só gera em memória.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp", "ico", "tiff"] }
fast_image_resize = "5"
kamadak-exif = "0.5"
webp = "0.3"
# #737 (Explorer perf F2): cache de thumbnail em memória (LRU pros thumbs quentes).
# O cache em disco usa blake3 (já acima) pra chavear por path|mtime|size. `lru` é
# o LRU byte-limitado da camada de memória.
lru = "0.12"
# Remote S4 (#687): wiring do transporte/captura existente para o app Tauri.
# O vídeo chega ao WebView por IPC raw; input usa o contrato congelado do S3.
# #809/#834: o transporte Remote (str0m→OpenSSL, WASAPI, enigo) fica atrás da
# feature `remote` (OFF por default). O build padrão (Wagner, CI) NÃO compila
# OpenSSL — foi o que quebrou no #809 original (feature ligada incondicional).
# Ligar só onde há toolchain OpenSSL: `cargo build --features remote`.
galaxie-remote-transport = { path = "../services/remote-transport", features = ["webrtc", "input"], optional = true }
galaxie-remote-capture = { path = "../services/remote-capture", optional = true }
# Remote (#1108): enumeração de IPs de interface reais pra candidatos ICE host.
# O bind fica em `0.0.0.0:0` (recebe em todas as interfaces), mas `0.0.0.0` NUNCA
# pode virar candidato — o str0m rejeita ("ICE bad candidate: invalid ip
# 0.0.0.0"). `if-addrs` dá todos os IPs de interface (cross-platform, sem
# OpenSSL); geramos 1 candidato host por IP real. Gated na feature `remote` (só o
# runtime Remote usa) pra o build padrão continuar enxuto.
if-addrs = { version = "0.10.2", optional = true }
# Dependência direta só pra poder ligar `openssl/vendored` na feature `remote`
# (o consumidor real do OpenSSL é o str0m, via remote-transport).
openssl = { version = "0.10", optional = true }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
# Splash circular (#164): recorta a janela `splashscreen` num circulo via
# SetWindowRgn (regiao eliptica do GDI). O OS clipa a janela — os cantos deixam
# de existir, ve-se o desktop atras, sem transparencia/frost/quadrado. Versao
# casada com a que o proprio tauri 2.11 ja resolve (0.61), pra nao duplicar o
# crate na arvore; o `splash.hwnd()` do Tauri devolve exatamente este HWND.
# CreateEllipticRgn + SetWindowRgn vivem em Win32::Graphics::Gdi; HWND em
# Win32::Foundation. Nada de Win32_UI_WindowsAndMessaging aqui.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    # #272 S2: GetKeyState + VK_* pros modificadores no handler de accelerators.
    "Win32_UI_Input_KeyboardAndMouse",
    # #202: CoTaskMemFree pra liberar a string do WebMessageReceived (scroll).
    "Win32_System_Com",
    # #275 rework: SHCreateMemStream pro CapturePreview (snapshot-to-image).
    "Win32_UI_Shell",
    # #1046 (SEC2): revelar_no_explorer sem shell — ILCreateFromPathW/ILFree/
    # SHOpenFolderAndSelectItems (e o tipo ITEMIDLIST) vivem no submódulo Common.
    "Win32_UI_Shell_Common",
    # #676 Explorer: GetLogicalDrives/GetDriveTypeW/GetDiskFreeSpaceExW/
    # GetVolumeInformationW pra listar drives com tipo, label e espaço.
    "Win32_Storage_FileSystem",
    # #680 turbo: DeviceIoControl + IOCTL_STORAGE_QUERY_PROPERTY pra detectar
    # seek-penalty (SSD vs HDD) e tunar threads×buffer da cópia. Win32_Security
    # entra porque CreateFileW recebe SECURITY_ATTRIBUTES na assinatura.
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_Security",
    # #871: mapear/desconectar network drive (menu "New → Network drive" do ribbon)
    # via WNetAddConnection2W/WNetCancelConnection2W.
    "Win32_NetworkManagement_WNet",
] }
# #272 S2 (accelerators do Navigator): AcceleratorKeyPressed do WebView2. Versao
# ja resolvida transitivamente pelo wry 2.11 (0.38.2) — dep direta so pra usar as
# interfaces, sem duplicar crate na arvore (mesmo cuidado do `windows`).
webview2-com = "0.38"
# DPAPI para cifrar a sessao em disco (o Cofre de Credenciais tem limite de
# 2560 bytes por blob e o refresh token da Microsoft nao cabe).
winapi = { version = "0.3", features = ["dpapi", "wincrypt", "minwindef", "winbase"] }

# ── Perfil de dev enxuto (#605) ──────────────────────────────────────────────
# O `cargo build` de dev estourava a RAM (OOM do rustc-LLVM/linker) na maquina do
# Wagner. Neste binario gigante (tauri + wry + windows + webview2-com), o grande
# consumidor de memoria no codegen/link e o *debuginfo*: o perfil dev padrao usa
# `debug = 2` (DWARF/PDB completo) pra TODOS os crates. Cortar debuginfo e o lever
# principal contra o OOM (opt-level fica 0 como no dev padrao — nada de LTO, que
# explodiria a memoria; `codegen-units` fica no 256 padrao do dev, que mantem os
# modulos LLVM pequenos = menos RAM por modulo; `incremental` segue ligado).
[profile.dev]
# Mantem arquivo/linha em panics e backtraces (dev continua diagnosticavel via
# log "como Delphero"), mas descarta o grosso do DWARF/PDB do nosso crate.
debug = "line-tables-only"

# Nao se debuga DENTRO das deps (tauri/wry/windows/reqwest/...). Zerar o debuginfo
# delas encolhe drasticamente os .o e o PDB no link — o maior ganho de memoria.
[profile.dev.package."*"]
debug = false
