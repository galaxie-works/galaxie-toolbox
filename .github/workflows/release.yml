# Compila, assina e publica o instalador no repositório PÚBLICO de distribuição.
#
# O código fica no repositório privado; só o instalador e o manifesto vão para
# galaxie-toolbox-releases, que é público. Release de repositório privado não é
# baixável sem token, e token não se embute em aplicativo cliente.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag já existente para (re)publicar, ex.: v0.9.2"
        required: true

permissions:
  contents: read

env:
  REPO_DISTRIBUICAO: galaxie-works/galaxie-toolbox-releases

jobs:
  # #1056 (TST-05): o release publicava com gate MENOR que o de PR — rodava só
  # `pnpm test` antes do `tauri build`, sem lint, sem test:component e sem
  # test:browser. Um PR que reprovasse neles não integrava; uma tag que
  # reprovaria era publicada. Agora chama a MESMA definição que o `ci.yml`.
  gate-front:
    uses: ./.github/workflows/gate-front.yml

  windows:
    # O build só começa depois do gate passar.
    needs: gate-front
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # #1270: as notas da release saem de arquivo VERSIONADO
      # (`docs/releases/<tag>.md`), nunca de placeholder. Este step vem ANTES do
      # build porque falhar depois de ~20min de compilacao por um arquivo de
      # texto que falta e desperdicio — e porque o defeito que ele fecha era
      # justamente um default silencioso passar batido ate producao.
      - name: Notas da release (obrigatórias)
        id: notas
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          $destino = Join-Path $env:RUNNER_TEMP "notas-release.md"
          ./scripts/notas-release.ps1 -Tag $tag -Saida $destino | Out-Null
          "arquivo=$destino" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Notas lidas de docs/releases/$tag.md"

      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      # #1056 (TST-08): o path era `~/.pnpm-store`, que o pnpm 11 NÃO usa (o
      # store fica em `~/.local/share/pnpm/store/<v>` no Linux e em
      # `%LOCALAPPDATA%\pnpm\store\<v>` no Windows). O step salvava um
      # diretório vazio e restaurava nada — cache que AFIRMA e não confere.
      # Agora o caminho vem do próprio pnpm, em vez de literal.
      - name: Descobrir o store do pnpm
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache do pnpm
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          # Sem `restore-keys` um lockfile novo perdia o cache INTEIRO; com ele
          # o run parte do store da última key do mesmo SO.
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable # explícito: pinada por SHA (#1637), o ref já não diz `stable`. Codex #1639.

      # A compilação do Rust é o que domina o tempo aqui; sem cache cada
      # release levaria vários minutos a mais.
      - name: Cache do cargo
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # Os testes (node:test) rodam ANTES do build do Rust — que domina o tempo.
      # Uma regressão barra o release aqui em segundos, sem gastar a compilação
      # inteira só pra descobrir que a versão não deveria sair.
      # O `pnpm test` saiu daqui: o job `gate-front` (mesma definição do CI) já
      # roda os 3 canais + lint antes deste job começar (`needs`). Mantê-lo aqui
      # seria rodar o mais fraco dos três de novo, no runner caro do Windows.

      # O `openssl/vendored` (ligado pela feature `remote`) compila o OpenSSL a
      # partir do fonte, e no Windows esse build precisa do NASM para as rotinas
      # em assembly. O Perl já vem na imagem (Strawberry).
      - name: NASM (para o OpenSSL vendored do Remote)
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1

      - name: Compilar e assinar
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # #387 follow-up: config de telemetria embutida em compile-time
          # (option_env! no telemetry.rs). Endpoint/stream não são segredo → vars;
          # email/token de ingestão → secrets. Ausentes = telemetria fica off
          # (fail-closed) + emissão segue consent-gated no runtime.
          GALAXIE_TELEMETRY_OTLP_ENDPOINT: ${{ vars.GALAXIE_TELEMETRY_OTLP_ENDPOINT }}
          GALAXIE_TELEMETRY_STREAM_NAME: ${{ vars.GALAXIE_TELEMETRY_STREAM_NAME }}
          GALAXIE_TELEMETRY_INGEST_EMAIL: ${{ secrets.GALAXIE_TELEMETRY_INGEST_EMAIL }}
          GALAXIE_TELEMETRY_INGEST_TOKEN: ${{ secrets.GALAXIE_TELEMETRY_INGEST_TOKEN }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        # `--features remote` é o que faz o instalador levar o backend do GALAXIE
        # Remote de verdade (str0m/WebRTC + captura + input). SEM ele o bundle sai
        # com o `remote_stub` e todo comando `remote_*` responde "não compilado" —
        # o recurso chega MORTO no usuário, que foi o caso até a v0.40.2 inclusive.
        run: pnpm tauri build --features remote

      # A assinatura é o ponto do processo inteiro: sem o .sig o aplicativo
      # instalado recusa a atualização, então a ausência dele para o release
      # aqui em vez de publicar algo que ninguém consegue instalar.
      - name: Montar o manifesto
        id: manifesto
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          $versao = $tag.TrimStart("v")

          $base = "src-tauri/target/release/bundle/nsis"
          $exe = Get-ChildItem "$base/*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "Instalador NSIS nao encontrado em $base" }

          $sig = "$($exe.FullName).sig"
          if (-not (Test-Path $sig)) {
            throw "Assinatura nao encontrada: $sig. Os segredos de assinatura foram configurados?"
          }

          # O productName tem espaco, entao o instalador nasce "GALAXIE
          # Toolbox_...exe". O GitHub troca espaco por ponto ao subir o anexo,
          # e o manifesto apontaria para um nome que nao existe - o app acharia
          # a atualizacao e falharia no download. Renomear aqui elimina a
          # divergencia na origem.
          $nomeSeguro = $exe.Name -replace ' ', '-'
          $exeFinal = Join-Path $exe.DirectoryName $nomeSeguro
          if ($exeFinal -ne $exe.FullName) {
            Move-Item $exe.FullName $exeFinal -Force
            Move-Item $sig "$exeFinal.sig" -Force
            $sig = "$exeFinal.sig"
          }

          $url = "https://github.com/${{ env.REPO_DISTRIBUICAO }}/releases/download/$tag/$nomeSeguro"
          if ($nomeSeguro -match '[^A-Za-z0-9._-]') {
            throw "Nome do instalador ainda tem caractere problematico: $nomeSeguro"
          }
          # #1270: fonte unica com o corpo da release (canon SS6.7). Antes:
          # `notes = "GALAXIE $tag"` — placeholder que deixava o modal de update
          # do usuario sem changelog.
          $notas = (Get-Content "${{ steps.notas.outputs.arquivo }}" -Raw -Encoding utf8).Trim()
          if ([string]::IsNullOrWhiteSpace($notas)) {
            throw "Notas da release vazias apos a leitura de ${{ steps.notas.outputs.arquivo }} (#1270)"
          }
          $manifesto = [ordered]@{
            version   = $versao
            notes     = $notas
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content $sig -Raw).Trim()
                url       = $url
              }
            }
          }
          $manifesto | ConvertTo-Json -Depth 5 | Set-Content latest.json -Encoding utf8

          "instalador=$exeFinal" | Out-File $env:GITHUB_OUTPUT -Append
          "tag=$tag"                    | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Instalador: $nomeSeguro"
          Write-Host "URL: $url"

      # RELEASES_TOKEN e um PAT com Contents: read/write SOMENTE no repositorio
      # de distribuicao. O GITHUB_TOKEN desta execucao nao alcanca outro
      # repositorio.
      - name: Publicar no repositório de distribuição
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ steps.manifesto.outputs.tag }}"
          $exe = "${{ steps.manifesto.outputs.instalador }}"

          $existe = gh release view $tag --repo $env:REPO_DISTRIBUICAO 2>$null
          if ($?) {
            gh release upload $tag $exe "$exe.sig" latest.json --repo $env:REPO_DISTRIBUICAO --clobber
          } else {
            # #1270: mesmo texto do latest.json — um unico changelog.
            gh release create $tag $exe "$exe.sig" latest.json `
              --repo $env:REPO_DISTRIBUICAO `
              --title "GALAXIE $tag" `
              --notes-file "${{ steps.notas.outputs.arquivo }}"
          }

      - name: Guardar o instalador na execução
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: instalador-windows
          path: |
            ${{ steps.manifesto.outputs.instalador }}
            latest.json
