[package]
name = "galaxie-remote-signaling"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["json", "ws"] }
base64 = "0.22"
ed25519-dalek = "2.2"
futures-util = "0.3"
galaxie-remote-net = { path = "../remote-net", features = ["authority"] }
hmac = "0.12"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.18", features = ["serde", "v4"] }

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
