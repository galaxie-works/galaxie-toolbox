# Borda HTTP da plataforma — #1505 (costura vertical 3/3 do #1265). O Router axum que serve
# o contrato (#1503) sobre os crates de domínio. axum/tokio (sem OpenSSL — o TLS é do Traefik,
# mesma origem). Esta 1ª fatia é o NÚCLEO DE SEGURANÇA: o mapeamento erro→HTTP (condição 1 do
# Altair, "404 idêntico no fio") + o extractor de sessão. Router/rotas/OAuth vêm em cima.
[package]
name = "galaxie-platform-http"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# O binário de PRODUÇÃO (`src/main.rs`) sai por padrão. O `dev-server` (porta de sessão sintética,
# fatia 2 do #1505) só é CONSTRUÍDO com `--features dev` — achado do @Altair (#1540): um
# `cargo build --release` normal NÃO deve produzi-lo, senão a garantia "não está no artefato" dependia
# de um Dockerfile cuidadoso. Isto NÃO é a "flag" recusada no desenho (que escolheria caminho DENTRO
# do artefato de prod) — aqui a feature decide se um binário SEPARADO nasce; o `main` segue sem uma
# linha de semeadura, ligada ou não.
[features]
dev = []

[[bin]]
name = "dev-server"
path = "src/bin/dev-server.rs"
required-features = ["dev"]

[dependencies]
# `tokio` + `http1` habilitam `axum::serve` (o binário sobe o servidor). O TLS de ENTRADA é do
# Traefik (mesma origem) — nada de OpenSSL aqui. Sem `json`: os corpos são montados à mão / via serde_json.
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
# JSON de DADOS (membros têm nome/email de usuário → escaping correto, não hand-roll). Os erros
# seguem manuais (slugs fixos, sem dado do cliente). DTO na borda; os tipos de domínio ficam serde-free.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Binário de produção (fatia 1 do #1505): runtime + observabilidade, padrão da casa (remote-signaling).
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
galaxie-platform-identity = { path = "../platform-identity" }
galaxie-platform-web = { path = "../platform-web" }
# Domínio OAuth (#1695): a DECISÃO do fluxo (PKCE/state/amarra, authority segura, allowlist). Puro —
# a borda BUSCA bytes e seta cookie; este crate decide. Sem HTTP nem segredo, como o próprio doc diz.
galaxie-platform-oauth = { path = "../platform-oauth" }
galaxie-platform-conta = { path = "../platform-conta" }
galaxie-platform-org-admin = { path = "../platform-org-admin" }
galaxie-platform-config = { path = "../platform-config" }
galaxie-platform-back-office = { path = "../platform-back-office" }

[dev-dependencies]
# Os testes leem o CORPO inteiro da resposta (o teste do anti-oráculo compara status+headers+CORPO)
# e exercem o Router por `oneshot` (sem subir socket). `tokio` já é dep de runtime do binário.
tower = { version = "0.5", default-features = false, features = ["util"] }
http-body-util = "0.1"
