[package]
name = "galaxie-remote-capture"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
tracing = "0.1.44"
# Contrato congelado S1↔S2: agora que o S2 (#685) está integrado, o capture
# reexporta os tipos de `remote-transport` em vez da cópia 1:1. `default-features
# = false` = SÓ o núcleo (frame/command/stats) — NÃO puxa `str0m`/OpenSSL (a
# feature `webrtc` fica desligada), então não vaza pro build do app/Wagner.
galaxie-remote-transport = { path = "../remote-transport", default-features = false }

[target.'cfg(windows)'.dependencies]
openh264 = "0.9.8"
windows-capture = "2.0.1"
windows = { version = "0.62.2", features = [
  "Foundation",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_UI_HiDpi",
] }

[dev-dependencies]
serde_json = "1.0.149"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }

[[example]]
name = "capture_probe"
required-features = []

[[example]]
name = "monitor_probe"
required-features = []

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
